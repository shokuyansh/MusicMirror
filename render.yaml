services:
  - type: web
    name: musicmirror-api
    runtime: go
    plan: free
    rootDir: server
    buildCommand: go build -trimpath -ldflags='-s -w' -o musicmirror ./cmd/musicmirror
    startCommand: ./musicmirror
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: music
      - key: MAX_UPLOAD_MB
        value: '20'
      - key: MAX_STORAGE_MB
        value: '500'
      - key: TRUST_PROXY
        value: 'true'
  - type: web
    name: musicmirror-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        sync: false
      - key: VITE_MAX_UPLOAD_MB
        value: '20'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
